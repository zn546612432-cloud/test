let dev=false,expanded=false,islandMode='charging',search='',editId=null;const $=s=>document.querySelector(s);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(state))}catch{alert('本地空间不足，请导出数据并缩小图片。')}};const visible=a=>a.filter(x=>x.day<=state.day);const ico=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+svg[k]+'</svg>';const tile=a=>'<button class="app-tile" data-app="'+a[0]+'"><span class="icon" style="--bg:'+a[2]+';--fg:'+a[3]+'">'+ico(a[0])+'</span><span>'+a[1]+'</span></button>';const header=(title,right='')=>'<div class="head"><button class="back" data-back>‹ 返回</button><h2>'+escape(title)+'</h2><span>'+right+'</span></div>';const row=(id,title,sub,avatar='',extra='')=>'<button class="row" data-open="'+escape(id)+'">'+(avatar?'<span class="avatar" style="--avatar:'+avatar+'">'+escape(title[0])+'</span>':'')+'<span class="copy"><b>'+escape(title)+'</b><small>'+escape(sub)+'</small></span>'+extra+'</button>';function render(){const root=$('#view');$('#screen').classList.toggle('dark',state.dark);$('#wallpaper').style.backgroundImage=state.wallpaper?'url("'+state.wallpaper.replace(/"/g,'%22')+'")':'';$('#battery').textContent=state.battery+'%';$('#time').textContent=state.locked?'9:41':String(9+((state.day-1)%12))+':41';$('#island').classList.toggle('active',expanded);$('#island-title').textContent=islandMode==='phone'?'模拟通话':'正在充电';$('#island-sub').textContent=islandMode==='phone'?'熙旺 · 点击结束':'第 '+state.day+' 天 · 点击收起';

if(!detail)body=header(k==='chat'?'微信':'MIRAGE CIPHER')+'<h1 class="large-title">'+(k==='chat'?'微信':'MIRAGE CIPHER')+'</h1><input class="search" data-search placeholder="搜索会话" value="'+escape(search)+'">'+(k==='cipher'?'<button class="card" data-open="bounties" style="width:100%;text-align:left;color:inherit"><b>匿名悬赏</b><p>查看当前可见委托 ›</p></button>':'')+threads.filter(t=>t.name.toLowerCase().includes(search.toLowerCase())).map(t=>row(t.id,t.name,visible(t.messages).at(-1)?.text||'暂无消息',k==='chat'?'#7f9ac2':'#27665c',state.read[t.id]?'':'<span class="badge">1</span>')).join('')}

else if(k==='settings')body=header('设置')+'<h1 class="large-title">设置</h1><div class="card toggle">深色外观 <button data-action="dark">'+(state.dark?'关闭':'开启')+'</button></div><button class="row" data-action="wallpaper">更换壁纸 <span style="margin-left:auto">›</span></button><button class="row" data-action="charge">插上充电器 · 进入下一天 <span style="margin-left:auto">›</span></button><button class="row" data-action="dev">开发者模式 <span style="margin-left:auto">›</span></button><p class="hint">普通日不要求阅读指定内容。编辑与图片可在开发者模式中完成。</p>';
if(k==='cipher'&&detail==='bounties')body=header('匿名悬赏')+'<h1 class="large-title">悬赏</h1>'+visible(state.bounties).map(b=>row(b.id,b.name,b.description)).join('');if(k==='cipher'&&state.bounties.some(x=>x.id===detail)){let b=state.bounties.find(x=>x.id===detail);body=header('悬赏详情')+'<div class="card"><h2>'+escape(b?.name||'')+'</h2><p>'+escape(b?.description||'')+'</p></div>'}
root.innerHTML='<section class="page appview '+(k==='cipher'?'mirage':'')+'">'+body+'</section>';
}
function home(){state.screen='home';state.detail=null;search='';save();render()}function openApp(k){state.screen=k;state.detail=null;search='';save();render()}function back(){if(state.detail){if(state.screen==='cipher'&&state.bounties.some(x=>x.id===state.detail))state.detail='bounties';else state.detail=null}else home();render()}function nextDay(){if(state.day>=90)return;state.charging=true;state.battery=100;islandMode='charging';expanded=true;render();setTimeout(()=>{state.day++;state.battery=78;state.charging=false;expanded=false;state.locked=true;home();save();render()},1200)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-app],[data-open],[data-action],[data-back],#home-indicator,#island,#outer-dev');if(!el)return;if(el.id==='outer-dev'||el.dataset.action==='dev'){dev=true;renderDev();return}if(el.id==='home-indicator'){home();return}if(el.id==='island'){expanded=!expanded;if(islandMode==='phone'&&!expanded)islandMode='charging';render();return}if(el.dataset.back!==undefined){back();return}if(el.dataset.app){openApp(el.dataset.app);return}if(el.dataset.open){state.detail=el.dataset.open;render();return}const action=el.dataset.action;if(action==='unlock'||action==='camera'){state.locked=false;save();render()}else if(action==='light'){el.textContent=el.textContent==='⌁'?'✦':'⌁'}else if(action==='dark'){state.dark=!state.dark;save();render()}else if(action==='charge'){nextDay()}else if(action==='new-note'){const n={id:'n'+Date.now(),title:'新备忘录',text:'',day:state.day};state.notes.unshift(n);state.detail=n.id;save();render()}else if(action==='delete-note'){state.notes=state.notes.filter(n=>n.id!==state.detail);state.detail=null;save();render()}else if(action==='wallpaper'){dev=true;renderDev('appearance')}else if(action==='call'){islandMode='phone';expanded=true;render()}});
document.addEventListener('input',e=>{if(e.target.matches('#note-title,#note-text')){let n=state.notes.find(x=>x.id===state.detail);if(n){n[e.target.id==='note-title'?'title':'text']=e.target.value;save()}}if(e.target.matches('[data-search]')){search=e.target.value;let pos=e.target.selectionStart;render();let inp=$('[data-search]');inp?.focus();inp?.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id!=='message-form')return;e.preventDefault();let value=e.target.elements.text.value.trim();if(!value)return;let t=state.threads.find(x=>x.id===state.detail);t.messages.push({id:'m'+Date.now(),who:'我',text:value,day:state.day,time:'现在'});save();render();let page=$('.page');page.scrollTop=page.scrollHeight});
let touchY=0;$('#screen').addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});$('#screen').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientY-touchY;if(state.locked&&d< -55){state.locked=false;save();render()}else if(!state.locked&&d< -95&&touchY>innerHeight*.75)home()},{passive:true});
function renderDev(section=''){let root=$('#dev-root');if(!dev){root.innerHTML='';return}let current=state.threads.find(x=>x.id===editId)||state.threads[0];editId=current.id;let threadOptions=state.threads.map(t=>'<option value="'+escape(t.id)+'"'+(t.id===editId?' selected':'')+'>'+escape(t.name)+'</option>').join('');root.innerHTML='<section class="dev"><div class="bar"><button data-dev="close">完成 · 返回手机</button><button data-dev="export">导出 JSON</button><button data-dev="import">导入 JSON</button><input type="file" id="import-file" accept="application/json" hidden></div><h2>开发者模式</h2><p style="color:#b8c4da;font-size:13px">直接改内容，自动保存在本机。图片和对话在导出的 JSON 中一并保存。正式上线前请定期导出备份。</p><label>预览游戏日</label><input id="dev-day" type="number" min="1" max="90" value="'+state.day+'"><label>编辑会话</label><select id="dev-thread">'+threadOptions+'</select><label>会话名称</label><input id="dev-thread-name" value="'+escape(current.name)+'"><div id="dev-messages">'+current.messages.map((m,i)=>'<div class="entry"><label>消息 '+(i+1)+' · 第 <input class="msg-day" data-i="'+i+'" type="number" min="1" max="90" value="'+m.day+'" style="width:65px;display:inline;padding:4px"> 天</label><input class="msg-who" data-i="'+i+'" value="'+escape(m.who)+'" aria-label="发送者"><textarea class="msg-text" data-i="'+i+'" aria-label="消息正文">'+escape(m.text)+'</textarea><button class="danger" data-dev="remove-msg" data-i="'+i+'">删除消息</button></div>').join('')+'</div><button data-dev="add-msg">＋ 增加消息</button><button data-dev="add-thread">＋ 增加会话</button><button class="danger" data-dev="remove-thread">删除此会话</button><h3>图片</h3><label>替换图片（上传本地 PNG/JPG/WebP）</label><select id="dev-photo">'+state.photos.map(p=>'<option value="'+escape(p.id)+'">'+escape(p.name)+'</option>').join('')+'</select><input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp"><label>图片名称</label><input id="dev-photo-name" value="'+escape(state.photos[0]?.name||'')+'"><button data-dev="add-photo">＋ 增加图片</button><button class="danger" data-dev="remove-photo">删除当前图片</button><h3>外观</h3><label>壁纸图片</label><input type="file" id="wallpaper-file" accept="image/png,image/jpeg,image/webp"><button data-dev="clear-wallpaper">恢复默认壁纸</button><h3>数据</h3><button class="danger" data-dev="reset">清空演示存档</button></section>';if(section==='appearance')root.querySelector('h3:last-of-type')?.scrollIntoView()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-dev]');if(!b)return;let a=b.dataset.dev,thread=state.threads.find(t=>t.id===editId);if(a==='close'){dev=false;renderDev();render();return}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download='ximeng-phone-content.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(a==='import'){$('#import-file').click();return}if(a==='add-msg'){thread.messages.push({id:'m'+Date.now(),who:'我',text:'',day:state.day,time:'现在'})}if(a==='remove-msg')thread.messages.splice(+b.dataset.i,1);if(a==='add-thread'){let t={id:'t'+Date.now(),name:'新会话',kind:'chat',messages:[]};state.threads.push(t);editId=t.id}if(a==='remove-thread'){if(state.threads.length<2)return alert('至少保留一个会话');state.threads=state.threads.filter(t=>t.id!==editId);editId=state.threads[0].id}if(a==='add-photo')state.photos.push({id:'p'+Date.now(),name:'新照片',src:'',day:state.day});if(a==='remove-photo'){if(state.photos.length<2)return alert('至少保留一张照片');state.photos=state.photos.filter(p=>p.id!==$('#dev-photo').value)}if(a==='clear-wallpaper')state.wallpaper='';if(a==='reset'){if(!confirm('清空当前浏览器的所有演示内容？请先导出备份。'))return;state=structuredClone(defaults)}save();renderDev();render()});
document.addEventListener('input',e=>{if(!dev)return;let x=e.target,thread=state.threads.find(t=>t.id===editId);if(x.id==='dev-day')state.day=Math.min(90,Math.max(1,+x.value||1));else if(x.id==='dev-thread-name')thread.name=x.value;else if(x.classList.contains('msg-text'))thread.messages[+x.dataset.i].text=x.value;else if(x.classList.contains('msg-who'))thread.messages[+x.dataset.i].who=x.value;else if(x.classList.contains('msg-day'))thread.messages[+x.dataset.i].day=Math.min(90,Math.max(1,+x.value||1));else if(x.id==='dev-photo-name'){let p=state.photos.find(p=>p.id===$('#dev-photo').value);if(p)p.name=x.value}else return;save();render()});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='dev-thread'){editId=x.value;renderDev();return}if(x.id==='dev-photo'){let p=state.photos.find(p=>p.id===x.value);$('#dev-photo-name').value=p?.name||'';return}if(x.id==='import-file'&&x.files[0]){x.files[0].text().then(t=>{try{let data=JSON.parse(t);if(!Array.isArray(data.threads)||!Array.isArray(data.photos))throw Error('格式不正确');state=data;save();renderDev();render()}catch(err){alert('导入失败：'+err.message)}});return}if((x.id==='photo-file'||x.id==='wallpaper-file')&&x.files[0]){let reader=new FileReader();reader.onload=()=>{if(x.id==='wallpaper-file')state.wallpaper=reader.result;else{let p=state.photos.find(p=>p.id===$('#dev-photo').value);if(p)p.src=reader.result}save();renderDev();render()};reader.readAsDataURL(x.files[0])}});
render();
</script></body></html>
