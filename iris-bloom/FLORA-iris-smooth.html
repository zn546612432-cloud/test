<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cbbbae" />
    <meta name="description" content="一朵随手掌舒展和合拢的鸢尾花。" />
    <title>FLORA — Iris</title>
    <style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #cbbbae;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #cbbbae;
  overscroll-behavior: none;
}

button { font: inherit; }

.flower-stage {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #cbbbae;
  isolation: isolate;
}

.flower-canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: ew-resize;
}

.flower-canvas:focus-visible {
  outline: 1px solid rgba(95, 68, 91, .55);
  outline-offset: -9px;
}

.gesture-toggle {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: max(29px, env(safe-area-inset-bottom) + 18px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 44px;
  padding: 5px 13px 5px 6px;
  background: rgba(246, 240, 232, .58);
  color: #635466;
  border: 1px solid rgba(109, 91, 100, .17);
  border-radius: 100px;
  box-shadow: 0 2px 19px rgba(85, 61, 66, .055);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  font-size: 11px;
  letter-spacing: .17em;
  font-weight: 400;
  white-space: nowrap;
  cursor: pointer;
  transition: background .35s, color .35s, border-color .35s, opacity .35s;
}

.gesture-toggle:hover { background: rgba(250, 247, 242, .78); }
.gesture-toggle:focus-visible { outline: 2px solid #765e85; outline-offset: 4px; }
.gesture-toggle:active { transform: translateX(-50%) scale(.98); }

.gesture-ring {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(215, 201, 211, .50);
  transition: background .35s;
}

.gesture-ring svg { width: 17px; height: 17px; }

.gesture-toggle[data-state="loading"] .gesture-ring {
  background: #e0d0dc;
  animation: breathe 1.7s ease-in-out infinite;
}

.gesture-toggle[data-state="ready"] {
  background: rgba(247, 241, 237, .44);
  border-color: rgba(94, 74, 92, .12);
}

.gesture-toggle[data-state="tracking"] .gesture-ring { background: #c6b7c9; }

.message {
  position: absolute;
  z-index: 2;
  left: 16px;
  right: 16px;
  bottom: max(88px, env(safe-area-inset-bottom) + 77px);
  margin: 0;
  color: #6a5965;
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: .08em;
  opacity: 0;
  pointer-events: none;
  transition: opacity .45s ease;
}

.message.is-visible { opacity: .85; }

@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(151, 114, 157, .06); }
  50% { box-shadow: 0 0 0 6px rgba(151, 114, 157, .10); }
}

@media (max-width: 600px) {
  .gesture-toggle { bottom: max(24px, env(safe-area-inset-bottom) + 14px); }
  .message { bottom: max(81px, env(safe-area-inset-bottom) + 72px); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0ms !important; }
}

</style>
  </head>

    <main class="flower-stage" aria-label="隔空手势控制的鸢尾花">
      <canvas id="flowerCanvas" class="flower-canvas" role="slider" aria-label="鸢尾花开合程度，左右拖动调整"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"></canvas>
      <button id="gestureToggle" class="gesture-toggle" type="button"

        <span class="gesture-ring" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 11V6a1.35 1.35 0 0 1 2.7 0v4.5V4.8a1.35 1.35 0 0 1 2.7 0V11 6a1.35 1.35 0 0 1 2.7 0v5.6-2a1.35 1.35 0 0 1 2.7 0v5.5c0 3.5-2.6 5.9-5.9 5.9h-1.3c-2.5 0-4-1.2-5.2-3.5l-2-3.4a1.35 1.35 0 0 1 2.3-1.4L8 15" />
          </svg>
        </span>
        <span class="gesture-label" id="gestureLabel">开启感应</span>
      </button>
      <p id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></p>
      <video id="camera" autoplay muted playsinline hidden aria-hidden="true"></video>
    </main>

// ---------------------------------------------------------------------------
// Smoothness rewrite
//  1. The hand now maps to the flower ABSOLUTELY (open hand = full bloom),
//     instead of adding up tiny frame-to-frame deltas that could be lost or
//     saturate early.
//  2. A render loop eases the shown position toward the target every screen
//     refresh and cross-fades the two neighbouring frames, so 60 stills look
//     like continuous motion.
//  3. Frames are kept as pre-sized ImageBitmaps so the browser never has to
//     re-decode a picture in the middle of the animation.
// ---------------------------------------------------------------------------
let target = 0;          // where the hand / finger wants the flower to be (0..1)
let shown = 0;           // where the flower is drawn right now (0..1)
let dirty = true;
let loopId = 0;
let lastTick = 0;
let viewWidth = 0;
let viewHeight = 0;
let pixelRatio = 1;
let pointerId = null;
let pointerOriginX = 0;
let pointerOriginProgress = 0;
let messageTimer = 0;
let cameraStream = null;
let landmarker = null;
let starting = false;
let running = false;
let lastVideoTime = -1;
let handVisible = false;
let lastHandAt = 0;
let lastAria = -1;
let frameGeneration = 0;
let bitmapWidth = 0;
let rebuildTimer = 0;
let lastTimestamp = 0;
let inferErrors = 0;

const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
const lerp = (a, b, amount) => a + (b - a) * amount;
const distance = (a, b) =>
  Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
const mapRange = (value, from, to) => clamp((value - from) / (to - from), 0, 1);

// ---- One-Euro filter: calm when the hand is still, quick when it moves ----
function makeOneEuro(minCutoff, beta, dCutoff = 1) {
  let xPrev = null;
  let dxPrev = 0;
  let tPrev = 0;
  const smoothing = (cutoff, dt) => {
    const r = 2 * Math.PI * cutoff * dt;
    return r / (r + 1);
  };
  return {
    reset() { xPrev = null; dxPrev = 0; },
    filter(x, t) {
      if (xPrev === null) { xPrev = x; tPrev = t; return x; }
      const dt = Math.max((t - tPrev) / 1000, 1 / 120);
      tPrev = t;
      const dx = (x - xPrev) / dt;
      dxPrev += smoothing(dCutoff, dt) * (dx - dxPrev);
      const cutoff = minCutoff + beta * Math.abs(dxPrev);
      xPrev += smoothing(cutoff, dt) * (x - xPrev);
      return xPrev;
    },
  };
}
const signalFilter = makeOneEuro(1.6, 2.5);

// ---- Self-calibrating hand range ----
// Every hand is different. We remember the most closed / most open this
// person has shown, so "fully open hand" always means "fully bloomed".
const OPEN_LO_DEFAULT = 0.12;
const OPEN_HI_DEFAULT = 0.55;
let openLo = OPEN_LO_DEFAULT;
let openHi = OPEN_HI_DEFAULT;

// ---- Canvas sizing & frame bitmaps ----
function bitmapSize() {
  const scale = Math.min(
    1,
    Math.min(viewWidth / FRAME_WIDTH, viewHeight / FRAME_HEIGHT) * pixelRatio
  );
  return {
    w: Math.max(2, Math.round(FRAME_WIDTH * scale)),
    h: Math.max(2, Math.round(FRAME_HEIGHT * scale)),
  };
}

function resize() {
  viewWidth = Math.max(1, window.innerWidth);
  viewHeight = Math.max(1, window.innerHeight);
  pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(viewWidth * pixelRatio);
  canvas.height = Math.round(viewHeight * pixelRatio);
  context.imageSmoothingEnabled = true;
  context.imageSmoothingQuality = "high";
  draw(shown);
  window.clearTimeout(rebuildTimer);
  rebuildTimer = window.setTimeout(() => {
    const { w } = bitmapSize();
    if (bitmapWidth && Math.abs(w - bitmapWidth) / bitmapWidth > 0.08) loadFrames();
  }, 300);
}

function getLoadedFrame(wanted) {
  if (frames[wanted]) return frames[wanted];
  for (let gap = 1; gap < FRAME_COUNT; gap++) {
    if (frames[wanted - gap]) return frames[wanted - gap];
    if (frames[wanted + gap]) return frames[wanted + gap];
  }
  return null;
}

function paintFrame(image, alpha, geo) {
  const iw = image.width;
  const ih = image.height;
  context.globalAlpha = alpha;
  // Extend only the empty background at the edges so the full flower stays
  // visible on narrow phones (nothing is cropped).
  if (geo.top > 0) {
    context.drawImage(image, 0, 0, iw, 1, geo.left, 0, geo.width, geo.top);
    context.drawImage(image, 0, ih - 1, iw, 1, geo.left, geo.top + geo.height, geo.width, geo.bottom);
  }
  if (geo.left > 0) {
    context.drawImage(image, 0, 0, 1, ih, 0, geo.top, geo.left, geo.height);
    context.drawImage(image, iw - 1, 0, 1, ih, geo.left + geo.width, geo.top, geo.right, geo.height);
  }
  context.drawImage(image, geo.left, geo.top, geo.width, geo.height);
}

function draw(value) {
  context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  context.globalAlpha = 1;
  context.fillStyle = "#cbbbae";
  context.fillRect(0, 0, viewWidth, viewHeight);

  const pct = Math.round(value * 100);
  if (pct !== lastAria) {
    lastAria = pct;
    canvas.setAttribute("aria-valuenow", String(pct));
  }

  const position = value * (FRAME_COUNT - 1);
  const lower = Math.min(Math.floor(position), FRAME_COUNT - 1);
  const upper = Math.min(lower + 1, FRAME_COUNT - 1);
  const mix = position - lower;
  const first = getLoadedFrame(lower);
  if (!first) return;

  const scale = Math.min(viewWidth / FRAME_WIDTH, viewHeight / FRAME_HEIGHT);
  const width = FRAME_WIDTH * scale;
  const height = FRAME_HEIGHT * scale;
  const left = (viewWidth - width) / 2;
  const top = (viewHeight - height) / 2;
  const geo = {
    left, top, width, height,
    right: Math.max(0, viewWidth - left - width),
    bottom: Math.max(0, viewHeight - top - height),
  };

  paintFrame(first, 1, geo);
  // Cross-fade into the next still: this is what turns 60 pictures into
  // continuous motion instead of visible "steps".
  if (mix > 0.004) {
    const second = getLoadedFrame(upper);
    if (second && second !== first) paintFrame(second, mix, geo);
  }
  context.globalAlpha = 1;
}

// ---- Main loop: runs only while something is moving ----
function ensureLoop() {
  if (loopId) return;
  lastTick = performance.now();
  loopId = requestAnimationFrame(loop);
}

function loop(time) {
  // loopId stays set while this frame runs, so nothing can start a 2nd loop.
  if (running) infer(time);

  const dt = clamp((time - lastTick) / 1000, 0.001, 0.05);
  lastTick = time;
  if (shown !== target) {
    // Time-based easing: same feel at 60 Hz, 90 Hz or 120 Hz screens.
    const tau = pointerId !== null ? 0.045 : 0.12;
    shown += (target - shown) * (1 - Math.exp(-dt / tau));
    if (Math.abs(target - shown) < 0.0003) shown = target;
    dirty = true;
  }
  if (dirty) {
    dirty = false;
    draw(shown);
  }
  loopId = running || shown !== target || dirty ? requestAnimationFrame(loop) : 0;
}

function setTarget(next) {
  target = clamp(next, 0, 1);
  ensureLoop();
}

function requestRender() {
  dirty = true;
  ensureLoop();
}

// ---- Frame loading (decoded once, kept as ready-to-paint bitmaps) ----
async function makeFrame(index, size) {
  const image = new Image();
  image.decoding = "async";
  image.src = embeddedFrameSources[index];
  try {
    await image.decode();
  } catch {
    return null;
  }
  if (typeof createImageBitmap !== "function") return image;
  try {
    return await createImageBitmap(image, {
      resizeWidth: size.w,
      resizeHeight: size.h,
      resizeQuality: "high",
    });
  } catch {
    return image;
  }
}

async function loadFrames() {
  const generation = ++frameGeneration;
  const size = bitmapSize();
  bitmapWidth = size.w;
  let next = 0;

  const place = (index, frame) => {
    const old = frames[index];
    frames[index] = frame;
    if (old && old !== frame && typeof old.close === "function") old.close();
    const near = Math.floor(shown * (FRAME_COUNT - 1));
    if (index === near || index === near + 1 || index === 0) requestRender();
  };

  const worker = async () => {
    while (next < FRAME_COUNT && generation === frameGeneration) {
      const index = next++;
      const frame = await makeFrame(index, size);
      if (generation !== frameGeneration) {
        if (frame && typeof frame.close === "function") frame.close();
        return;
      }
      if (frame) place(index, frame);
      else if (index === 0) showMessage("花朵画面加载失败，请从网页服务器打开", 6500);
    }
  };

  // First picture first, so something appears immediately.
  next = 1;
  const first = await makeFrame(0, size);
  if (generation !== frameGeneration) return;
  if (first) place(0, first);
  else showMessage("花朵画面加载失败，请从网页服务器打开", 6500);
  await Promise.all(Array.from({ length: 6 }, worker));
}

function showMessage(text, duration = 3600) {
  window.clearTimeout(messageTimer);
  message.textContent = text;
  message.classList.add("is-visible");
  messageTimer = window.setTimeout(() => message.classList.remove("is-visible"), duration);
}

function clearMessage() {
  window.clearTimeout(messageTimer);
  message.classList.remove("is-visible");
}

function setButtonState(state) {
  if (toggle.dataset.state === state) return;
  toggle.dataset.state = state;
  const titles = {
    idle: "开启感应",
    loading: "连接中",
    ready: "伸出手掌",
    tracking: "感应中",
  };
  label.textContent = titles[state] || "开启感应";
  const active = state !== "idle";
  toggle.setAttribute("aria-pressed", String(active));
  toggle.setAttribute("aria-label", active ? "关闭相机手势控制" : "开启相机手势控制");
}

// Retained directly from the installed build-gesture-animation skill's
// hand-fold calculation (no custom model or landmark formula added).
function getFoldSignal(hand) {
  const wrist = hand[0];
  const palmBase = hand[9];
  const palmWidth = Math.max(distance(hand[5], hand[17]), distance(wrist, palmBase), 0.001);
  const fingers = [[8, 6], [12, 10], [16, 14], [20, 18]];
  const fingerExtension =
    fingers.reduce((sum, [tip, pip]) => {
      const reachPastKnuckle = (distance(hand[tip], wrist) - distance(hand[pip], wrist)) / palmWidth;
      return sum + mapRange(reachPastKnuckle, 0.08, 0.72);
    }, 0) / fingers.length;
  const fingerReach =
    fingers.reduce((sum, [tip]) => sum + distance(hand[tip], wrist) / palmWidth, 0) /
    fingers.length;
  const reach = mapRange(fingerReach, 1.16, 2.18);
  const fingerOpen = clamp(fingerExtension * 0.68 + reach * 0.32, 0, 1);
  const pinchOpen = mapRange(distance(hand[4], hand[8]) / palmWidth, 0.26, 1.04);
  return clamp(1 - (pinchOpen * 0.78 + fingerOpen * 0.22), 0, 1);
}

// Turns "how open is the hand" into "how bloomed is the flower" (0..1).
function openToBloom(open) {
  if (open < openLo) openLo = open;
  if (open > openHi) openHi = open;
  // Slowly forget one-off glitches so the range keeps fitting the user.
  openLo += (OPEN_LO_DEFAULT - openLo) * 0.0008;
  openHi += (OPEN_HI_DEFAULT - openHi) * 0.0008;
  const normalized = mapRange(open, openLo, openHi);
  // Small dead margins at both ends: a relaxed open hand already counts as
  // fully bloomed, a loose fist as fully closed.
  return mapRange(normalized, 0.05, 0.95);
}

function handleDetectedHand(hand, time) {
  const reacquired = !handVisible || time - lastHandAt > 520;
  handVisible = true;
  lastHandAt = time;
  if (reacquired) signalFilter.reset();
  setButtonState("tracking");

  const open = signalFilter.filter(1 - getFoldSignal(hand), time);
  setTarget(openToBloom(open));
}

function handleMissingHand(time) {
  if (!handVisible || time - lastHandAt < 520) return;
  handVisible = false;
  signalFilter.reset();
  setButtonState("ready");
  // Keep the last flower frame during tracking loss.
}

function infer(time) {
  if (!landmarker || camera.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
  if (camera.currentTime === lastVideoTime) {
    handleMissingHand(time);
    return;
  }
  lastVideoTime = camera.currentTime;
  try {
    // No artificial throttle: every new camera picture is used (≈30 per second).
    // MediaPipe needs strictly increasing timestamps.
    lastTimestamp = Math.max(time, lastTimestamp + 1);
    const hands = landmarker.detectForVideo(camera, lastTimestamp).landmarks || [];
    inferErrors = 0;
    if (hands[0]) handleDetectedHand(hands[0], time);
    else handleMissingHand(time);
  } catch (error) {
    console.warn("hand detection error", error);
    // Ignore a stray hiccup; only give up if it keeps failing.
    if (++inferErrors >= 8) {
      stopTracking();
      showMessage("手势识别中断，请重新开启", 5000);
    }
  }
}

async function getHandModel() {
  if (landmarker) return landmarker;
  const visionTasks = await import(VISION_URL);
  const vision = await visionTasks.FilesetResolver.forVisionTasks(WASM_URL);
  const options = (delegate) => ({
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO",
    numHands: 1,
    minHandDetectionConfidence: 0.55,
    minTrackingConfidence: 0.55,
  });
  try {
    landmarker = await visionTasks.HandLandmarker.createFromOptions(vision, options("GPU"));
  } catch {
    landmarker = await visionTasks.HandLandmarker.createFromOptions(vision, options("CPU"));
  }
  return landmarker;
}

function stopTracking() {
  running = false;
  starting = false;
  camera.pause();
  if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
  cameraStream = null;
  camera.srcObject = null;
  handVisible = false;
  lastVideoTime = -1;
  inferErrors = 0;
  signalFilter.reset();
  openLo = OPEN_LO_DEFAULT;
  openHi = OPEN_HI_DEFAULT;
  setButtonState("idle");
  ensureLoop(); // lets the flower finish settling, then the loop sleeps
}

async function startTracking() {
  if (starting || running) return;
  if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
    showMessage("相机需要 HTTPS 网页或 localhost", 5500);
    return;
  }
  starting = true;
  setButtonState("loading");
  clearMessage();
  try {
    // Request permission as the direct result of the user's tap.
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } },
      audio: false,
    });
    camera.srcObject = cameraStream;
    await camera.play();
    await getHandModel();
    running = true;
    starting = false;
    lastVideoTime = -1;
    setButtonState("ready");
    ensureLoop();
  } catch (error) {
    stopTracking();
    if (error?.name === "NotAllowedError") showMessage("请允许相机访问", 5500);
    else if (error?.name === "NotFoundError") showMessage("没有找到可用的相机", 5500);
    else showMessage("暂时无法启动手势识别，请检查网络后重试", 5500);
  }
}

toggle.addEventListener("click", () => {
  if (running) {
    stopTracking();
    clearMessage();
  } else {
    startTracking();
  }
});

// Invisible manual fallback for local preview and phone gesture testing.
canvas.addEventListener("pointerdown", (event) => {
  if (event.pointerType === "mouse" && event.button !== 0) return;
  pointerId = event.pointerId;
  pointerOriginX = event.clientX;
  pointerOriginProgress = shown;
  target = shown; // grab the flower where it is, no jump
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
  if (event.pointerId !== pointerId) return;
  const distanceAcross = Math.max(180, Math.min(viewWidth * 0.72, 440));
  setTarget(pointerOriginProgress + (event.clientX - pointerOriginX) / distanceAcross);
});

function releasePointer(event) {
  if (event.pointerId !== pointerId) return;
  pointerId = null;
  if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
}
canvas.addEventListener("pointerup", releasePointer);
canvas.addEventListener("pointercancel", releasePointer);
canvas.addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    setTarget(target + (event.key === "ArrowRight" ? 1 : -1) / 59);
  } else if (event.key === "Home" || event.key === "End") {
    event.preventDefault();
    setTarget(event.key === "Home" ? 0 : 1);
  }
});

window.addEventListener("resize", resize, { passive: true });
window.addEventListener("pagehide", stopTracking);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopTracking();
});

setButtonState("idle");
resize();
loadFrames();

</script>

</html>
